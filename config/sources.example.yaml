sources:
  weflow:
    enabled: true
    type: weflow

    connection:
      host: localhost
      port: 5031
      access_token: "<configure-locally>"

    monitor:
      chats: []

    trigger:
      content_threshold: 1000
      message_threshold: 10
      idle_timeout: 20
      min_trigger_interval: 5

    template:
      path: templates/wx_template_example.j2
