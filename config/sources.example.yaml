sources:
  weflow:
    enabled: true
    type: weflow

    connection:
      host: localhost
      port: 5031
      access_token: "<configure-locally>"

    monitor:
      chats: []

    trigger:
      content_threshold: 1000
      message_threshold: 10
      idle_timeout: 20
      min_trigger_interval: 5

    template:
      path: templates/wx_template_example.j2

  telegram:
    enabled: false
    type: telegram

    connection:
      bot_token: "<telegram_bot_token>"

    monitor:
      allowed_chat_ids: []

  slack:
    enabled: false
    type: slack

    connection:
      app_token: "<xapp-token>"
      bot_token: "<xoxb-token>"

    monitor:
      allowed_channels: []

  github_webhook:
    enabled: false
    type: github_webhook

    webhook:
      path: /webhooks/github
      secret: "<github_webhook_secret>"

phase9:
  enabled: true
  db_path: data/pulserelay_phase9.db
